<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
<meta name="description" content="Estudia inglés, francés, alemán y japonés comparándolos con el español, lado a lado.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="4 Lenguas">
<meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Cuatro Lenguas</title>
<style>
/* =====================================================================
   DISEÑO · minimalista: neutros cálidos, tarjetas suaves y un color por idioma.
   ===================================================================== */
:root{--bg:#f6f6f3;--card:#ffffff;--ink:#16171a;--mut:#6c7078;--line:#e7e6e1;--soft:#f0efeb;--hover:#f4f3ef;
  --sh:0 1px 2px rgba(20,20,15,.04),0 6px 24px -8px rgba(20,20,15,.10);--r:16px;
  --es:#d9480f;--en:#1d6fd8;--fr:#b8237a;--de:#0f8a5f;--ja:#b08800;--ok:#16834a;--bad:#c62828;--warn:#b45309;
  --font:"Inter","SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0e0f11;--card:#17191c;--ink:#ececee;--mut:#9aa0a8;--line:#262a2f;--soft:#1e2125;--hover:#1c1f23;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6);
  --es:#f08a4b;--en:#5b9df5;--fr:#e66aa8;--de:#3dbb8a;--ja:#f2d24b;--ok:#4ade80;--bad:#ff7b7b;--warn:#fbbf24}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:.55em .95em;transition:background .15s,border-color .15s,transform .08s}
button:hover{background:var(--hover);border-color:color-mix(in srgb,var(--mut) 35%,var(--line))}
button:active{transform:scale(.97)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.pri{background:var(--ink);color:var(--bg);border-color:transparent;font-weight:600}
button.pri:hover{background:color-mix(in srgb,var(--ink) 88%,var(--bg))}
button:disabled{opacity:.4;cursor:default;transform:none}
select{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:.5em .7em;max-width:100%}
h2{font-size:1.45rem;margin:.1em 0 .7em;letter-spacing:-.02em;font-weight:700}
h3{font-size:.8rem;margin:1.8em 0 .7em;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600}
.mut{color:var(--mut)}.peq{font-size:.86rem}
@media (prefers-reduced-motion:no-preference){#app.anim>*{animation:entra .22s ease both}@keyframes entra{from{opacity:0;transform:translateY(4px)}}}

/* ---------- Estructura: barra lateral (escritorio) + barra inferior (móvil) ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.lado{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;padding:4px 8px;font-size:1.02rem}
.logo i{display:grid;grid-template-columns:repeat(2,8px);gap:3px}.logo i b{width:8px;height:8px;border-radius:50%;background:var(--c)}
#nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:12px;border:0;background:none;padding:.6em .8em;border-radius:10px;color:var(--mut);text-align:left;font-weight:500}
.nv svg{width:20px;height:20px;flex:none}
.nv:hover{background:var(--hover);color:var(--ink)}
.nv.on{background:var(--card);color:var(--ink);box-shadow:var(--sh);font-weight:600}
.cuerpo{min-width:0}
.barra{position:sticky;top:0;z-index:5;height:60px;display:flex;align-items:center;gap:12px;padding:0 28px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px)}
.barra .logo{display:none;padding:0}
.barra .titulo{flex:1;font-weight:600;color:var(--mut);font-size:.92rem}
.stats{display:flex;gap:6px;align-items:center;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;padding:.3em .7em;border-radius:999px;background:var(--card);box-shadow:var(--sh);color:var(--ink)}
.pill svg{width:15px;height:15px}.pill .mut{font-weight:500}
main{max-width:1080px;margin:0 auto;padding:12px 28px 80px}
.tabbar{display:none}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}.lado{display:none}
  .barra{padding:0 16px;height:56px}.barra .logo{display:flex}.barra .titulo{display:none}.barra .logo+.stats{margin-left:auto}
  .pill.opc{display:none}
  main{padding:8px 16px calc(96px + env(safe-area-inset-bottom))}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:8;
    background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
    border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px -10px rgba(0,0,0,.25);padding:6px}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.45em 0;font-size:.62rem;color:var(--mut);border-radius:16px;font-weight:600}
  .tabbar svg{width:22px;height:22px}
  .tabbar button.on{color:var(--ink);background:var(--soft)}
  h2{font-size:1.3rem}
}

/* ---------- Superficies comunes ---------- */
.card,.nota,.panel,.kpi,.orl,.entrada,.med,.fila{background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
.nota{padding:16px 18px;margin:14px 0}.nota p{margin:.35em 0}.nota .l{font-weight:700;color:var(--c)}.ojo{color:var(--warn)}
.aviso{background:var(--soft);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.92rem}
table{border-collapse:collapse;width:100%;font-size:.92rem;background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
td,th{text-align:left;padding:.6em .8em;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}
code{background:var(--soft);padding:.1em .4em;border-radius:6px;font-size:.85em;overflow-wrap:anywhere}
textarea,input[type=text],input[type=password],input[type=number]{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:.65em .8em}
textarea{min-height:200px;resize:vertical;line-height:1.65}
.sub{display:inline-flex;gap:2px;flex-wrap:wrap;margin-bottom:16px;background:var(--soft);padding:4px;border-radius:14px}
.sub button{border:0;background:none;border-radius:10px;padding:.45em .9em;color:var(--mut);font-weight:500}
.sub button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh);font-weight:600}
.fila2{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:center}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.cols2{grid-template-columns:1fr}}
.dos{display:grid;grid-template-columns:2fr 1fr;gap:18px}@media(max-width:760px){.dos{grid-template-columns:1fr}}
label.peq{display:inline-flex;flex-direction:column;gap:4px;color:var(--mut)}

/* ---------- Filtros e idiomas ---------- */
.es{--c:var(--es)}.en{--c:var(--en)}.fr{--c:var(--fr)}.de{--c:var(--de)}.ja{--c:var(--ja)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:.38em .85em;font-weight:600;font-size:.88rem;border:1px solid var(--line);background:var(--card);color:var(--mut)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);opacity:.35}
.chip.on{color:var(--ink);border-color:color-mix(in srgb,var(--c) 55%,var(--line));background:color-mix(in srgb,var(--c) 10%,var(--card))}
.chip.on::before{opacity:1}

/* ---------- Hoy ---------- */
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:24px;background:var(--card);border-radius:22px;box-shadow:var(--sh);margin-bottom:14px}
.hero h2{margin:.1em 0 .25em;font-size:1.7rem}
.anillo{position:relative;width:118px;height:118px;flex:none}.anillo svg{width:100%;height:100%;transform:rotate(-90deg)}
.anillo div{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.15}
.anillo b{font-size:1.5rem}.anillo span{font-size:.75rem;color:var(--mut)}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.mini{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px}
.mini span{font-size:.78rem;color:var(--mut)}.mini b{display:block;font-size:1.35rem;letter-spacing:-.02em}
.cta{width:100%;display:flex;align-items:center;gap:16px;text-align:left;padding:20px 22px;border-radius:20px;border:0;background:var(--ink);color:var(--bg);box-shadow:var(--sh)}
.cta:hover{background:color-mix(in srgb,var(--ink) 90%,var(--bg))}
.cta svg{width:34px;height:34px;flex:none}.cta b{display:block;font-size:1.1rem}.cta span span{opacity:.72;font-size:.88rem}
.acc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.acc button{text-align:left;border:0;background:var(--card);box-shadow:var(--sh);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px}
.acc button b{font-size:1rem}.acc button span{font-size:.85rem;color:var(--mut)}
.pdd{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pdd button{text-align:left;border:0;background:var(--soft);border-radius:12px;padding:10px 12px}
.pdd button small{display:block;font-size:.72rem;font-weight:700;color:var(--c);letter-spacing:.04em}
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px;padding:16px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
.semana div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.semana i{display:block;width:100%;max-width:28px;border-radius:6px 6px 3px 3px;background:var(--ink);opacity:.85;min-height:3px}
.semana i.cero{opacity:.12}.semana div.hoy i{opacity:1}
.semana span{font-size:.72rem;color:var(--mut)}.semana div.hoy span{color:var(--ink);font-weight:700}
@media (max-width:820px){.hero{padding:18px}.hero h2{font-size:1.35rem}.anillo{width:92px;height:92px}.anillo b{font-size:1.2rem}.tres{gap:8px}.mini{padding:12px}.mini b{font-size:1.1rem}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tiles button{border:0;background:var(--card);box-shadow:var(--sh);border-radius:var(--r);padding:18px;text-align:left;display:flex;gap:14px;align-items:flex-start}
.tiles svg{width:26px;height:26px;flex:none;margin-top:2px}.tiles b{display:block}.tiles span{font-size:.85rem;color:var(--mut)}

/* ---------- Temas ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
@media (max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:10px}.tema{padding:13px}.tema .ti{font-size:.92rem}}
.tema{text-align:left;padding:16px;display:flex;flex-direction:column;gap:8px;border:0;background:var(--card);box-shadow:var(--sh);border-radius:var(--r)}
.tema:hover{background:var(--card);transform:translateY(-1px)}
.tema .ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-content:center;font-size:1.25rem}
.tema .ti{font-weight:600;font-size:1rem;letter-spacing:-.01em}
.niv{font-size:.68rem;font-weight:700;border-radius:6px;padding:.05em .45em;color:var(--mut);background:var(--soft);vertical-align:middle;letter-spacing:.03em}
.prog{height:5px;background:var(--soft);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ink);border-radius:9px}

/* ---------- Tabla comparativa ---------- */
.cab,.celdas{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px}
.cab{position:sticky;top:60px;z-index:2;padding:8px 6px;font-weight:600;font-size:.8rem;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
.cab span{display:flex;align-items:center;gap:7px;padding-left:10px}.cab span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.fila{margin-bottom:10px;padding:6px}
.celda{text-align:left;border:0;border-radius:11px;padding:.5em .7em;background:transparent;min-width:0;overflow-wrap:anywhere;position:relative;padding-left:.95em}
.celda::before{content:"";position:absolute;left:3px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--c);opacity:.75}
.celda:hover{background:var(--hover)}
.celda b{font-weight:600}.celda small{display:block;color:var(--mut);font-style:italic;font-size:.8rem}
.celda .cod{display:none;font-size:.68rem;font-weight:700;color:var(--c);margin-right:.5em;letter-spacing:.04em}
.celda.sim b{text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--c) 70%,transparent);text-decoration-thickness:2px;text-underline-offset:4px}
.celda.ja b{font-size:1.12em}.celda .kana{display:block;font-size:.82rem;color:var(--mut)}
.gen{font-style:normal;font-size:.66rem;font-weight:700;margin-left:.45em;padding:.05em .4em;border-radius:5px;background:var(--soft);color:var(--mut)}
.marcas{display:flex;flex-wrap:wrap;gap:6px;font-size:.76rem;margin:4px 6px 4px;color:var(--mut)}
.marcas span{background:var(--soft);border-radius:7px;padding:.1em .55em}
.marcas .fa,.marcas .rv{color:var(--warn);font-weight:600}
@media (max-width:640px){.cab{display:none}.celdas{grid-template-columns:1fr;gap:0}.celda .cod{display:inline}
  .celda small,.celda .kana{display:inline;margin-left:.5em}}

/* ---------- Juegos ---------- */
.panel{padding:22px;max-width:620px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.preg{font-size:1.65rem;font-weight:650;margin:.35em 0;text-align:center;overflow-wrap:anywhere;letter-spacing:-.02em}
.et{text-align:center;font-size:.78rem;font-weight:700;color:var(--c);letter-spacing:.06em;text-transform:uppercase}
.ops{display:grid;gap:8px;margin-top:16px}.ops button{text-align:left;padding:.85em 1.1em;border-radius:14px;background:var(--soft);border-color:transparent}
.ops button:hover{background:var(--hover);border-color:var(--line)}
.bien{border-color:var(--ok)!important;background:color-mix(in srgb,var(--ok) 13%,var(--card))!important}
.mal{border-color:var(--bad)!important;background:color-mix(in srgb,var(--bad) 13%,var(--card))!important}
.sel{border-color:var(--ink)!important;box-shadow:0 0 0 2px var(--ink)}
.hecho{opacity:.3;pointer-events:none}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:.92rem}
.pares{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pares div{display:grid;gap:8px;align-content:start}
.pares button{min-height:3.2em;overflow-wrap:anywhere;background:var(--soft);border-color:transparent}
.zona{min-height:3.4em;border:1.5px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.banco{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tok{padding:.45em .8em;font-weight:600;border-radius:10px}
.carta{min-height:180px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:16px}.g4 button{padding:.7em .2em;font-size:.88rem}
.caja{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{padding:14px 16px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,transparent)}
.kpi b{font-size:1.4rem;display:block;letter-spacing:-.02em}

/* ---------- Medallas, avisos, diario ---------- */
#toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:20;width:max-content;max-width:92vw}
@media (max-width:820px){#toasts{bottom:calc(96px + env(safe-area-inset-bottom))}}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;box-shadow:0 10px 30px -8px rgba(0,0,0,.35);font-size:.92rem;font-weight:500}
.vocab{display:flex;flex-wrap:wrap;gap:4px;max-height:320px;overflow:auto}.vocab button{padding:.25em .6em;font-size:.84rem;border-radius:9px}
.entrada{padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh),inset 3px 0 0 var(--c)}
.texto{white-space:pre-wrap;margin:.5em 0;line-height:1.65}
.err{border-bottom:1px solid var(--line);padding:7px 0;font-size:.92rem}.err s{color:var(--bad)}.err ins{color:var(--ok);text-decoration:none;font-weight:600}
.medallas{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.med{padding:12px;text-align:center;font-size:.84rem}
.med.no{opacity:.38;filter:grayscale(1)}.med .ic{font-size:1.6rem;display:block;margin-bottom:2px}
.esp{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}.esp button{padding:.2em .55em;min-width:2.3em;border-radius:9px}
.chart{width:100%;height:auto;display:block}
.dia{font-weight:600;font-size:.78rem;color:var(--mut);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.08em}

/* ---------- Oraciones y alfabeto ---------- */
.frase{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.seg{display:inline-flex;flex-direction:column;align-items:center;padding:.3em .6em;border-radius:10px;background:color-mix(in srgb,var(--rc) 11%,var(--card));box-shadow:inset 0 -2px 0 var(--rc)}
.seg b{font-weight:600}.seg small{font-size:.62rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.r-S{--rc:#2563eb}.r-V{--rc:#dc2626}.r-O{--rc:#16a34a}.r-A{--rc:#7c3aed}.r-C{--rc:#0891b2}.r-T{--rc:#c2410c}.r-N{--rc:#475569}.r-Q{--rc:#db2777}.r-K{--rc:#64748b}.r-sal{--rc:#a1a1aa}
.orl{padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh),inset 3px 0 0 var(--c)}
.letras{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.letra{text-align:center;padding:.55em .2em;border:0;background:var(--card);box-shadow:var(--sh);border-radius:14px}
.letra b{display:block;font-size:1.5rem;font-weight:600}.letra small{display:block;color:var(--mut);font-size:.72rem;overflow-wrap:anywhere}
.letra.esp{box-shadow:var(--sh),inset 0 0 0 2px var(--c)}
.historia{display:flex;flex-direction:column;gap:10px}
.hfrase{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px}
.hl{font-size:.64rem;font-weight:700;letter-spacing:.06em;margin-right:8px;vertical-align:2px}
.hg{font-size:1.15rem;font-weight:550;line-height:1.5}.hp{font-size:.93rem;opacity:.85}
.hr{display:block;font-size:.8rem;color:var(--mut);font-style:italic;padding-left:2.3em}
.hn{font-size:.84rem;color:var(--mut);margin:.6em 0 0}
/* ---------- Ruta (estilo Duolingo) ---------- */
.unidad{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 8px;padding:16px 18px;border-radius:18px;color:#fff;
  background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 70%,#000))}
.unidad b{display:block;font-size:1.15rem}.unidad .mut{color:rgba(255,255,255,.8)}
.unidad button{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:#fff}
.camino{display:flex;flex-direction:column;align-items:center;padding:10px 0 4px}
.nodo-w{display:flex;flex-direction:column;align-items:center;transform:translateX(var(--off));margin:8px 0;position:relative;max-width:300px}
.nodo-w small{margin-top:6px;font-size:.78rem;color:var(--mut);text-align:center;max-width:150px;font-weight:600}
.nodo{width:74px;height:74px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--c) calc(var(--p)*1%),var(--soft) 0);box-shadow:0 5px 0 color-mix(in srgb,var(--ink) 14%,transparent)}
.nodo span{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;background:var(--card)}
.nodo.hecho span{background:color-mix(in srgb,var(--c) 16%,var(--card))}
.nodo:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--ink) 14%,transparent)}
.nodo.cerrado{filter:grayscale(1);opacity:.55}
.nodo.actual{width:84px;height:84px;background:conic-gradient(var(--c) calc(max(var(--p),8)*1%),color-mix(in srgb,var(--c) 22%,var(--soft)) 0)}
.nodo.actual span{width:68px;height:68px}
@media (prefers-reduced-motion:no-preference){.nodo.actual{animation:late 1.8s ease-in-out infinite}@keyframes late{50%{transform:scale(1.06)}}}
.burbuja{position:absolute;top:-30px;font-style:normal;font-size:.72rem;font-weight:800;letter-spacing:.06em;color:var(--c);background:var(--card);padding:.25em .7em;border-radius:9px;box-shadow:var(--sh);white-space:nowrap}
.pop{margin-top:10px;background:var(--card);box-shadow:var(--sh);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;width:260px;text-align:center;z-index:3}
.historia-n span{font-size:1.5rem}
/* ---------- Lección a pantalla completa ---------- */
#leccion{display:none}
#leccion.activa{display:flex;flex-direction:column;position:fixed;inset:0;z-index:40;background:var(--bg)}
.lec-top{display:flex;align-items:center;gap:14px;max-width:760px;width:100%;margin:0 auto;padding:16px 20px 6px}
.lec-top .x{border:0;background:none;font-size:1.3rem;color:var(--mut);padding:.2em .4em}
.lec-prog{flex:1;height:14px}.lec-prog i{background:var(--c);transition:width .35s ease}
.vidas{font-weight:700;color:var(--bad);white-space:nowrap}
.lec-cuerpo{flex:1;overflow-y:auto;max-width:640px;width:100%;margin:0 auto;padding:14px 20px 24px}
.lec-cuerpo h2{font-size:1.45rem;margin:.4em 0 .8em}
.lec-prompt{display:flex;align-items:center;gap:12px;font-size:1.3rem;font-weight:600;margin-bottom:16px;padding:14px 16px;background:var(--card);border-radius:16px;box-shadow:var(--sh)}
.altavoz{width:86px;height:86px;border-radius:22px;font-size:2.2rem;border:0;background:var(--c);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 60%,#000)}
.altavoz:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 60%,#000)}
.lec-ops{display:grid;gap:10px}
.op{text-align:left;padding:.95em 1.1em;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:1.02rem;box-shadow:0 3px 0 var(--line)}
.op kbd{display:inline-grid;place-items:center;width:1.6em;height:1.6em;margin-right:.7em;border:1px solid var(--line);border-radius:6px;font:600 .75rem var(--font);color:var(--mut)}
.op.sel{border-color:var(--c)!important;background:color-mix(in srgb,var(--c) 10%,var(--card));box-shadow:0 3px 0 var(--c)!important}
.op.bien{box-shadow:0 3px 0 var(--ok)!important}.op.mal{box-shadow:0 3px 0 var(--bad)!important}
.hueco{text-decoration:none;border-bottom:2px solid var(--c);padding:0 .3em}
.lec-zona{min-height:64px;background:var(--card)}
.tok{box-shadow:0 3px 0 var(--line);border-width:2px}.tok.usado{opacity:.25;box-shadow:none}
#leccion .op:disabled,#leccion .tok:disabled:not(.usado){opacity:1}
.lec-txt{min-height:110px;font-size:1.1rem}
.lec-pie{border-top:1px solid var(--line);background:var(--bg)}
.lec-pie-in{max-width:760px;margin:0 auto;padding:16px 20px calc(16px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.lec-pie.ok{background:color-mix(in srgb,var(--ok) 14%,var(--bg));border-color:transparent}.lec-pie.ok b{color:var(--ok)}
.lec-pie.no{background:color-mix(in srgb,var(--bad) 13%,var(--bg));border-color:transparent}.lec-pie.no b{color:var(--bad)}
.lec-fb{display:flex;flex-direction:column;gap:3px;flex:1;min-width:200px}.lec-fb b{font-size:1.15rem}
button.grande{padding:.85em 1.6em;font-size:1rem;font-weight:700;border-radius:14px;min-width:140px}
.lec-pie.ok .pri{background:var(--ok);color:#fff}.lec-pie.no .pri{background:var(--bad);color:#fff}
.lec-fin{margin:auto;text-align:center;padding:24px;max-width:560px;position:relative}
.lec-icono{font-size:4rem}
.confeti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confeti i{position:absolute;top:-12px;left:var(--x);width:9px;height:14px;border-radius:2px;background:var(--c2);animation:cae 2.4s var(--d) ease-in forwards}
@keyframes cae{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
/* ---------- Gramática ---------- */
.reglas{display:grid;gap:10px}
.regla{background:var(--card);border-radius:14px;box-shadow:var(--sh),inset 3px 0 0 var(--c);padding:12px 16px;display:flex;flex-direction:column;gap:4px}
.regla .ejr{display:flex;align-items:center;gap:8px;justify-content:space-between;color:var(--mut);font-style:italic}
.regla .ejr button{padding:.2em .5em;font-style:normal}
.tconj th{font-size:.8rem;color:var(--mut);font-weight:600}.tconj td{white-space:nowrap}

#bInstalar{color:var(--ink);position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;display:flex;gap:12px;align-items:center;
 background:var(--card,#fff);border:1px solid var(--line);border-radius:18px;padding:12px 12px 12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.18);animation:subeB .35s ease}
#bInstalar img{width:42px;height:42px;border-radius:11px;flex:none}
#bInstalar>span{flex:1;font-size:.86rem;line-height:1.3}#bInstalar>span span{opacity:.75}
#bInstalar .x{background:none;border:0;font-size:1rem;padding:6px;opacity:.6;box-shadow:none}
@media(min-width:900px){#bInstalar{left:auto;right:20px;bottom:20px;max-width:420px}}
@keyframes subeB{from{transform:translateY(20px);opacity:0}}
</style>
</head>
<body>
<div class="shell">
  <aside class="lado"><div id="logoLado"></div><nav id="nav"></nav></aside>
  <div class="cuerpo">
    <header class="barra"><div id="logoBarra"></div><div class="titulo" id="titulo"></div><div class="stats" id="stats"></div></header>
    <main id="app"></main>
  </div>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div id="leccion"></div>
<div id="toasts"></div>
<input type="file" id="fCsv" accept=".csv,.tsv,.txt" hidden>
<input type="file" id="fJson" accept=".json" hidden>
<input type="file" id="fDiario" accept=".json" hidden>

const LANGS={es:{n:'Español',v:'es-ES'},en:{n:'English',v:'en-US'},fr:{n:'Français',v:'fr-FR'},de:{n:'Deutsch',v:'de-DE'},ja:{n:'日本語',v:'ja-JP'}};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=n=>Math.floor(Math.random()*n);
const baraja=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const fecha=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
/** Elige un elemento al azar con pesos. */
function azarPeso(arr,peso){let t=0;const ac=arr.map(x=>t+=peso(x));const r=Math.random()*t;return arr[Math.max(0,ac.findIndex(x=>x>r))]}

/* =====================================================================
   4. MODELO: temas, ítems, género y parecidos
   ===================================================================== */
let TODOS=[],IDX={};
/** Convierte una fila [es,en,pron,fr,pron,de,pron,tags,nota] en un ítem. */
function fila2item(c,t){
  return{id:t.id+':'+c[0],tm:t,es:{t:c[0]||''},en:{t:c[1]||'',p:c[2]||''},fr:{t:c[3]||'',p:c[4]||''},de:{t:c[5]||'',p:c[6]||''},
    ja:hazJa(c[9],c[10],c[11]),tags:(c[7]||'').split(/[\s,]+/).filter(Boolean),nota:c[8]||'',notaJa:''};
}
/** Quita los espacios entre bloques japoneses (se conservan junto a «/», «→», «(», «+»). */
const jaJunta=s=>(s||'').replace(/(?<=[^\s\/→(+])\s+(?=[^\s\/→()+])/g,'');
/** Japonés: t = texto sin espacios, seg = con espacios (bloques para juegos), k = kana, p = rōmaji. */
function hazJa(ja,kana,rom){ja=(ja||'').trim();const k=!kana||kana.trim()==='='?ja:kana.trim();return{t:jaJunta(ja),seg:ja,k:jaJunta(k),p:(rom||'').trim()}}
/** Añade el japonés de JA a los ítems de un tema (enlazando por el texto en español). */
function ponJa(t){
  const d=JA[t.id];if(!d)return;
  if(t.nota&&d.nota)t.nota={...t.nota,ja:d.nota};
  const m={};for(const l of d.filas.trim().split('\n')){const c=l.split('|').map(x=>x.trim());m[c[0]]=c}
  for(const it of t.items){const c=m[it.es.t];if(c){it.ja=hazJa(c[1],c[2],c[3]);it.notaJa=c[4]||''}}
}
const notaDe=(it,l)=>[it.nota,l==='ja'&&it.notaJa].filter(Boolean).join(' · ');
/** Une los temas integrados con los importados por el usuario. */
function construir(){
  TODOS=TEMAS.map(t=>{const o={...t,items:[]};o.items=t.filas.trim().split('\n').map(l=>fila2item(l.split('|').map(x=>x.trim()),o));ponJa(o);return o});
  for(const c of S.custom){
    let t=TODOS.find(x=>x.titulo.toLowerCase()===c.titulo.toLowerCase());
    if(!t){t={id:'u-'+c.titulo.toLowerCase().replace(/\s+/g,'-'),nivel:c.nivel||'A1',titulo:c.titulo,icono:'📝',items:[],propio:true};TODOS.push(t)}
    for(const f of c.filas){const it=fila2item(f,t);if(it.es.t&&!t.items.some(x=>x.id===it.id))t.items.push(it)}
  }
  /* Tema automático con los errores del diario: entran a flashcards y repaso */
  if(S.errDiario.length){const t={id:'diario-errores',nivel:'Diario',titulo:'Mis errores del diario',icono:'📓',siempre:true,items:[],
    nota:{idea:'Fragmentos que escribiste mal en tu diario. Lado español: lo que escribiste (✗). Respuesta: la corrección.'}};
    for(const e of S.errDiario){const it=fila2item([],t);it.id=t.id+':'+e.lang+':'+e.orig;it.es.t='✗ '+e.orig;it[e.lang].t=e.corr;it.nota=(e.tipo?'['+e.tipo+'] ':'')+(e.expl||'');t.items.push(it)}
    TODOS.push(t)}
  IDX={};for(const t of TODOS)for(const it of t.items)IDX[it.id]=it;
}
const limpio=t=>t.replace(/\s*\((m|f|n|pl)\)/g,'');
const GEN={es:{el:'m',un:'m',la:'f',una:'f',los:'pl',las:'pl'},fr:{le:'m',un:'m',la:'f',une:'f',les:'pl'},de:{der:'m',die:'f',das:'n',eine:'f'}};
/** Género de un ítem en un idioma: marcador explícito o deducido del artículo. */
function genero(it,l){
  const t=it[l].t,m=t.match(/\((m|f|n|pl)\)/);if(m)return m[1];
  if(it.tags.includes('f')||!GEN[l])return'';
  const w=t.toLowerCase().split(/\s+/);return w.length>1?(GEN[l][w[0]]||''):'';
}
const ART=/^(el|la|los|las|un|una|the|an|a|to|le|les|une|der|die|das|ein|eine)\s+|^l'/i;
const nucleo=t=>limpio(t).split('→')[0].split('/')[0].trim().toLowerCase().replace(ART,'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss');
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>i);for(let j=1;j<=b.length;j++){let p=d[0];d[0]=j;for(let i=1;i<=a.length;i++){const q=d[i];d[i]=Math.min(d[i]+1,d[i-1]+1,p+(a[i-1]!==b[j-1]));p=q}}return d[a.length]}
/** Grupos de idiomas cuya palabra se parece (cognados), p. ej. [['es','fr'],['en','de']]. */
function parecidos(it,ls){
  if(it.tags.includes('f'))return[];
  const n=ls.map(l=>nucleo(l==='ja'?it.ja.p:it[l].t)),g=ls.map((_,i)=>i);
  for(let i=0;i<ls.length;i++)for(let j=i+1;j<ls.length;j++){
    const a=n[i],b=n[j];if(a.length<3||b.length<3||/\s/.test(a+b))continue;
    if(1-lev(a,b)/Math.max(a.length,b.length)>=.6){const x=g[j];g.forEach((v,k)=>{if(v===x)g[k]=g[i]})}
  }
  const m={};g.forEach((v,i)=>(m[v]=m[v]||[]).push(ls[i]));return Object.values(m).filter(x=>x.length>1);
}
const langsOn=()=>META.filter(l=>S.cfg.langs.includes(l));
const temasVis=()=>TODOS.filter(t=>t.siempre||S.cfg.nivel==='all'||t.nivel===S.cfg.nivel);
const temaAct=()=>temasVis().find(t=>t.id===S.cfg.tema);
/** Ítems del ámbito actual (tema elegido, o todos los del nivel). */
const ambito=()=>temaAct()?temaAct().items:temasVis().flatMap(t=>t.items);

/* =====================================================================
   5. PROGRESO: XP, racha, tarjetas (repetición espaciada)
   ===================================================================== */
const DIA=864e5;
const carta=(it,l)=>S.cards[it.id+'|'+l];
const cartaOCrea=(it,l)=>S.cards[it.id+'|'+l]||(S.cards[it.id+'|'+l]={iv:0,due:0,ease:2.3,ok:0,bad:0});
function ganar(xp){
  S.xp+=xp;const h=fecha(),a=fecha(new Date(Date.now()-DIA));
  /* meta diaria de XP */
  if(S.hoy.dia!==h)S.hoy={dia:h,xp:0};const antes=S.hoy.xp;S.hoy.xp+=xp;
  S.hist=S.hist||{};S.hist[h]=(S.hist[h]||0)+xp;for(const k of Object.keys(S.hist).sort().slice(0,-90))delete S.hist[k];
  if(antes<+S.cfg.meta&&S.hoy.xp>=+S.cfg.meta){S.metas++;toast(`🎉 ¡Meta diaria cumplida! (${S.cfg.meta} XP)`)}
  if(S.racha.ultimo!==h){S.racha.n=S.racha.ultimo===a?S.racha.n+1:1;S.racha.ultimo=h}
  guardar();pintaStats();revisarMedallas();
}
/** Registra un acierto o fallo de cualquier juego. Los fallos vuelven a las flashcards de inmediato. */
function registrar(it,l,ok,xp=10){
  const c=cartaOCrea(it,l);
  if(ok){c.ok++;if(!c.iv){c.iv=1;c.due=Date.now()+DIA}ganar(xp)}
  else{c.bad++;c.iv=0;c.due=Date.now();guardar()}
}
const nivelXP=()=>Math.floor(Math.sqrt(S.xp/50))+1;
const pctTema=t=>{const ls=langsOn();let n=0;for(const it of t.items)for(const l of ls)if(carta(it,l)?.ok)n++;return t.items.length?Math.round(100*n/(t.items.length*ls.length)):0};
/** Idioma al azar; el prioritario sale el doble. */
const eligeLang=(ls=langsOn())=>azarPeso(ls,l=>l===S.cfg.prioridad?2:1);
/** Ítem al azar; los que más fallas pesan más. */
const eligeItem=(pool,l)=>azarPeso(pool.filter(i=>i[l].t),it=>{const c=carta(it,l);return 1+(c?2*Math.min(4,Math.max(0,c.bad-c.ok/2)):0)});

   ===================================================================== */
/* ---- Puente con Capacitor (app Android). En el navegador no hace nada. ----
   Se usa Capacitor.nativePromise directamente para no necesitar un empaquetador. */
const esNativo=()=>!!window.Capacitor?.isNativePlatform?.();
const nativo=(plugin,metodo,op)=>window.Capacitor.nativePromise(plugin,metodo,op);
let avisoVoz=false;
function hablar(t,l){
  const txt=limpio(t).replace(/→|\/|\.\.\./g,', ');
  if(esNativo()){ // El WebView de Android no trae speechSynthesis: se usa el plugin TextToSpeech
    nativo('TextToSpeech','stop',{}).catch(()=>{}).then(()=>nativo('TextToSpeech','speak',{text:txt,lang:LANGS[l].v,rate:.9,pitch:1,volume:1,category:'ambient'}))
      .catch(()=>{if(!avisoVoz){avisoVoz=true;toast(`No hay voz para ${LANGS[l].n}. Instálala en Ajustes › Texto a voz.`)}});
    return;
  }
  if(!('speechSynthesis' in window))return;
  const u=new SpeechSynthesisUtterance(txt);u.lang=LANGS[l].v;u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);
}

function filaHTML(it,ls){
  const grupos=parecidos(it,ls),sim=new Set(grupos.flat()),g=ls.map(l=>genero(it,l));
  const gs=new Set(g.filter(x=>x&&x!=='pl'));

  if(gs.size>1)m+=`<span>género distinto</span>`;
  if(it.tags.includes('fa'))m+=`<span class="fa">falso amigo</span>`;
  if(it.tags.includes('r'))m+=`<span class="rv">revisar</span>`;
  if(it.nota)m+=`<span>${esc(it.nota)}</span>`;
  if(it.notaJa&&ls.includes('ja'))m+=`<span>JA: ${esc(it.notaJa)}</span>`;
  return`<div class="fila"><div class="celdas" style="--n:${ls.length}">`+ls.map((l,i)=>
    `<button class="celda ${l} ${sim.has(l)?'sim':''}" data-act="voz" data-arg="${l}" data-t="${esc(it[l].t)}"><span class="cod">${l.toUpperCase()}</span><b>${esc(limpio(it[l].t)||'—')}</b>${g[i]?`<i class="gen">${g[i]}</i>`:''}${l==='ja'&&it.ja.k&&it.ja.k!==it.ja.t?`<span class="kana">${esc(it.ja.k)}</span>`:''}${it[l].p?`<small>${esc(it[l].p)}</small>`:''}</button>`).join('')+
    `</div>${m?`<div class="marcas">${m}</div>`:''}</div>`;
}

const norm=s=>limpio(s).toLowerCase().replace(/[.,;:!?¿¡"«»]/g,'').replace(/’/g,"'").replace(/\s+/g,' ').trim();
const sinAc=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss');
/** Japonés: acepta kanji, kana o rōmaji (sin importar macrones: ō = o = ou). */
const romN=s=>sinAc(s.toLowerCase()).replace(/[\s'’\-〜~]/g,'').replace(/ou/g,'o').replace(/oo/g,'o').replace(/uu/g,'u');
const jaN=s=>s.replace(/[\s。、？！?!.,〜~]/g,'');
function evaluaJa(resp,j){
  const r=resp.trim(),alt=x=>(x||'').split('/').map(y=>y.trim()).filter(Boolean);
  if([...alt(j.t),...alt(j.k)].some(a=>jaN(a)===jaN(r)))return'ok';
  if(alt(j.p).some(a=>romN(a)===romN(r)))return'ok';
  return'mal';
}
/** Evalúa una respuesta escrita: 'ok' | 'acento' | 'articulo' | 'mal'. */
function evalua(resp,correcto){
  const r=norm(resp),alts=limpio(correcto).split('/').map(norm);
  if(alts.includes(r))return'ok';
  if(alts.some(a=>sinAc(a)===sinAc(r)))return'acento';
  if(alts.some(a=>sinAc(a.replace(ART,''))===sinAc(r.replace(ART,''))))return'articulo';
  return'mal';
}

  return false;
}

/** Palabras de un texto; en japonés (sin espacios) se cuentan caracteres. */
const palabras=(t,l)=>l==='ja'?[...t.replace(/[\s\p{P}\p{S}\p{N}]/gu,'')]:(t.match(/\p{L}[\p{L}'’-]*/gu)||[]);
const unid=l=>l==='ja'?'caracteres':'palabras';
function metricas(e){
  const w=palabras(e.texto,e.lang),t=TODOS.find(x=>x.id===e.tema),low=e.texto.toLowerCase();
  const voc=t?t.items.filter(i=>i[e.lang].t&&!i.tags.includes('f')).map(i=>nucleo(i[e.lang].t)).filter(n=>n.length>2&&low.normalize('NFD').replace(/[̀-ͯ]/g,'').includes(n)).length:0;
  return{palabras:w.length,distintas:new Set(w.map(x=>x.toLowerCase())).size,frases:e.texto.split(/[.!?。！？]+/).filter(s=>s.trim()).length,
    voc,errores:e.corr?e.corr.errores.filter(x=>x.tipo!=='estilo').length:null};
}
function rachaDiario(){const d=new Set(S.diario.map(e=>e.dia));let t=Date.now();if(!d.has(fecha(new Date(t))))t-=DIA;let n=0;while(d.has(fecha(new Date(t)))){n++;t-=DIA}return n}

/** Gráfica pequeña (una por idioma): palabras y vocabulario distinto por entrada. */
function miniChart(es,l){
  if(es.length<2)return'<p class="mut peq">Escribe al menos 2 entradas para ver la evolución.</p>';
  const W=320,H=130,P=28,ms=es.map(metricas),max=Math.max(5,...ms.map(m=>m.palabras));
  const x=i=>P+i*(W-P-10)/(es.length-1),y=v=>H-20-(v/max)*(H-34);
  const ruta=k=>ms.map((m,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(m[k]).toFixed(1)).join('');
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Palabras por entrada en ${LANGS[l].n}">
   <line x1="${P}" x2="${W-10}" y1="${y(max)}" y2="${y(max)}" stroke="var(--line)" stroke-dasharray="2 3"/>
   <line x1="${P}" x2="${W-10}" y1="${H-20}" y2="${H-20}" stroke="var(--line)"/>
   <text x="${P-5}" y="${y(max)+3}" text-anchor="end" font-size="9" fill="var(--mut)">${max}</text><text x="${P-5}" y="${H-17}" text-anchor="end" font-size="9" fill="var(--mut)">0</text>
   <path d="${ruta('distintas')}" fill="none" stroke="var(--c)" stroke-width="2" stroke-dasharray="5 4" opacity=".55"/>
   <path d="${ruta('palabras')}" fill="none" stroke="var(--c)" stroke-width="2"/>
   ${ms.map((m,i)=>`<circle cx="${x(i)}" cy="${y(m.palabras)}" r="4" fill="var(--c)" stroke="var(--card)" stroke-width="2"/><circle cx="${x(i)}" cy="${y(m.palabras)}" r="12" fill="transparent"><title>${es[i].dia}: ${m.palabras} palabras, ${m.distintas} distintas${m.errores!==null?', '+m.errores+' errores':''}</title></circle>`).join('')}
   <text x="${P}" y="${H-5}" font-size="9" fill="var(--mut)">${es[0].dia}</text><text x="${W-10}" y="${H-5}" text-anchor="end" font-size="9" fill="var(--mut)">${es[es.length-1].dia}</text></svg>`;
}

const COLS=['nivel','tema','es','en','en_pron','fr','fr_pron','de','de_pron','tags','nota','ja','ja_kana','ja_romaji'];
/** Analizador CSV mínimo: detecta el separador (, ; tab |) y respeta comillas. */
function leeCSV(txt){
  txt=txt.replace(/^﻿/,'');const l1=txt.split(/\r?\n/)[0];
  const sep=[',',';','\t','|'].sort((a,b)=>l1.split(b).length-l1.split(a).length)[0];
  const filas=[];let f=[],c='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===sep){f.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;f.push(c);filas.push(f);f=[];c=''}
    else c+=ch}
  if(c||f.length){f.push(c);filas.push(f)}
  return filas.filter(r=>r.some(x=>x.trim()));
}
function importaCSV(txt){
  const fs=leeCSV(txt);if(fs.length<2)return'El archivo está vacío.';
  const h=fs[0].map(x=>x.trim().toLowerCase()),col=n=>h.indexOf(n);
  if(col('es')<0||col('tema')<0)return'Faltan las columnas obligatorias «tema» y «es» en la primera fila.';
  const g={};let n=0;
  for(const r of fs.slice(1)){const v=k=>col(k)<0?'':(r[col(k)]||'').trim();if(!v('es')||!v('tema'))continue;
    const k=v('tema').toLowerCase();g[k]=g[k]||{titulo:v('tema'),nivel:(v('nivel')||'A1').toUpperCase(),filas:[]};
    g[k].filas.push(COLS.slice(2).map(v));n++}
  for(const k in g){S.custom=S.custom.filter(c=>c.titulo.toLowerCase()!==k);S.custom.push(g[k])}
  guardar();construir();return`Importados ${n} ítems en ${Object.keys(g).length} tema(s).`;
}
function exportaCSV(){
  const q=s=>/[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  const ls=[COLS.join(',')];
  for(const t of TODOS)for(const i of t.items)ls.push([t.nivel,t.titulo,i.es.t,i.en.t,i.en.p,i.fr.t,i.fr.p,i.de.t,i.de.p,i.tags.join(' '),i.nota,i.ja.seg,i.ja.k===i.ja.t?'':i.ja.k,i.ja.p].map(q).join(','));
  bajar('cuatro-lenguas-contenido.csv','﻿'+ls.join('\n'),'text/csv');
}
/** Exporta un archivo. En Android lo guarda en caché y abre «Compartir» (Drive, WhatsApp, Archivos…). */
async function bajar(nombre,txt,tipo){
  if(esNativo()){
    try{const r=await nativo('Filesystem','writeFile',{path:nombre,data:txt,directory:'CACHE',encoding:'utf8'});
      await nativo('Share','share',{title:nombre,url:r.uri,dialogTitle:'Guardar o enviar '+nombre})}
    catch(e){if(!/cancel/i.test(e?.message||''))toast('No se pudo exportar: '+(e?.message||e))}
    return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:tipo}));a.download=nombre;document.body.append(a);a.click();a.remove()}
function leeArchivo(inp,fn){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{fn(r.result);inp.value='';pintar()};r.readAsText(f)}

    else{c.ok++;c.iv=q===1?Math.max(1,c.iv*1.2):q===2?(c.iv?c.iv*c.ease:1):(c.iv?c.iv*c.ease*1.3:3);

/** Botón «atrás» de Android: retrocede dentro de la app; en la pantalla inicial, cierra la app. */
function atras(){
  if(lec){A.lecSalir();return true}
  if(alfaQ){alfaQ=null}
  else if(vista==='reglas'&&regSel){regSel=null}
  else if(vista==='historias'&&hSel){hSel=null;hLeyendo=false}
  else if(dRev){dRev=null}
  else if(juego){juego=null}
  else if(vista==='comparar'&&S.cfg.tema!=='all'){S.cfg.tema='all';guardar()}
  else if(vista!=='hoy'){vista='hoy';aviso=''}
  else return false;
  pintar();scrollTo(0,0);return true;
}
if(esNativo())window.Capacitor.addListener('App','backButton',()=>{if(!atras())nativo('App','exitApp',{})});

let orSub='construir',orT='nombre',orGen='m';const orVals={};
const parseFrase=t=>(t||'').split('|').filter(Boolean).map(s=>{const i=s.indexOf(':');return{r:s.slice(0,i),t:s.slice(i+1)}});
const defSlot=s=>s.k==='nombre'&&S.cfg.nombre?S.cfg.nombre:s.def;
function valOr(p,k,l,campo){
  const s=p.slots.find(x=>x.k===k);if(!s)return'';const v=orVals[p.id+'.'+k]??defSlot(s);
  if(s.tipo!=='op')return v??'';
  let r=s.ops[+v||0][campo||l];if(Array.isArray(r))r=r[orGen==='f'?1:0];return r??'';
}
function armar(p,l){
  const t=(p.l[l]||'').replace(/\{g:([^}\/]*)\/([^}]*)\}/g,(_,m,f)=>orGen==='f'?f:m).replace(/\{(\w+)(?:\.(\w+))?\}/g,(_,k,c)=>valOr(p,k,l,c));
  return parseFrase(t);
}
/** Une los segmentos en texto normal (sin espacios en japonés; sin espacio tras apóstrofo). */
function unir(segs,l){
  if(l==='ja')return segs.map(s=>jaJunta(s.t)).join('');
  let o='';for(const{t}of segs){if(!t)continue;o+=(o&&!/['’]$/.test(o)&&!/^[,.?!]/.test(t)?' ':'')+t}return o;
}
const segHTML=(segs,l)=>`<div class="frase">${segs.map(s=>`<span class="seg r-${s.r}"><b>${esc(l==='ja'?jaJunta(s.t):s.t)}</b><small>${ROLES[s.r]||s.r}</small></span>`).join('')}</div>`;
const formula=segs=>segs.map(s=>ROLES[s.r]||s.r).join(' + ');
const leyendaRoles=()=>`<div class="frase" style="margin-bottom:12px">${Object.entries(ROLES).map(([r,n])=>`<span class="seg r-${r}" style="padding:.1em .5em"><small style="color:var(--ink)">${n}</small></span>`).join('')}</div>`;
function vOraciones(){
  const subs={construir:'Construir',estructura:'Estructura por idioma'};
  return`<h2>Oraciones</h2><div class="sub">${Object.entries(subs).map(([k,v])=>`<button class="${orSub===k?'on':''}" data-act="orSub" data-arg="${k}">${v}</button>`).join('')}</div>`+
    leyendaRoles()+(orSub==='construir'?orConstruir():orEstructura());
}
function slotHTML(p,s){
  const v=orVals[p.id+'.'+s.k]??defSlot(s);
  if(s.tipo==='texto')return`<label class="peq">${esc(s.et)}<input type="text" data-or="${p.id}.${s.k}" value="${esc(v)}" spellcheck="false"></label>`;
  if(s.tipo==='num')return`<label class="peq">${esc(s.et)}<input type="number" min="${s.min}" max="${s.max}" data-or="${p.id}.${s.k}" value="${esc(v)}" style="width:6em"></label>`;
  const et=o=>Array.isArray(o.es)?o.es[orGen==='f'?1:0]:o.es;
  return`<label class="peq">${esc(s.et)}<br><select data-chg="or:${p.id}.${s.k}">${s.ops.map((o,i)=>`<option value="${i}" ${+(v||0)===i?'selected':''}>${esc(et(o))}</option>`).join('')}</select></label>`;
}
function orConstruir(){
  const p=PLANTILLAS.find(x=>x.id===orT)||PLANTILLAS[0];
  return`<div class="filtros"><select data-chg="orT">${PLANTILLAS.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.titulo)}</option>`).join('')}</select>
    <select data-chg="orGen"><option value="m" ${orGen==='m'?'selected':''}>Hablo como hombre</option><option value="f" ${orGen==='f'?'selected':''}>Hablo como mujer</option></select></div>
    <div class="filtros" style="align-items:flex-end">${p.slots.map(s=>slotHTML(p,s)).join('')}</div><div id="orRes">${orResultado(p)}</div>`;
}
function orResultado(p){
  return['es',...langsOn()].map(l=>{const segs=armar(p,l),txt=unir(segs,l);
    return`<div class="orl ${l}"><div class="top" style="margin:0 0 8px"><b style="color:var(--c)">${LANGS[l].n}</b><span>${vozBtn(txt,l)} ${l!=='es'?`<button data-act="orDiario" data-arg="${l}" data-t="${esc(txt)}">Al diario</button>`:''}</span></div>
      ${segHTML(segs,l)}<p class="mut peq" style="margin:.6em 0 0"><b>Estructura:</b> ${esc(formula(segs))}</p>${p.n[l]?`<p class="peq" style="margin:.3em 0 0">${esc(p.n[l])}</p>`:''}</div>`}).join('');
}
function orEstructura(){
  const ls=['es',...langsOn()];
  return`<h3 style="margin-top:0">Orden básico</h3><div class="caja" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">${ls.map(l=>`<div class="kpi ${l}"><b style="font-size:1rem;color:var(--c)">${LANGS[l].n} · ${esc(ORDEN[l].f)}</b><p class="peq" style="margin:.4em 0 0">${esc(ORDEN[l].t)}</p></div>`).join('')}</div>`+
   ESTRUCTURAS.map(r=>`<h3>${esc(r.t)}</h3><p class="mut peq" style="margin-top:-.3em">${esc(r.n)}</p>`+ls.filter(l=>r[l]).map(l=>{const segs=parseFrase(r[l][1]);
     return`<div class="orl ${l}"><div class="top" style="margin:0 0 8px"><span><b style="color:var(--c)">${LANGS[l].n}</b> <span class="mut peq">${esc(r[l][0])}</span></span>${vozBtn(unir(segs,l),l)}</div>${segHTML(segs,l)}</div>`}).join('')).join('')+
   (ls.includes('ja')?`<h3>Partículas japonesas</h3><table>${PARTICULAS.map(([p,r,f,e])=>`<tr><td style="font-size:1.3rem"><b>${p}</b></td><td class="mut">${r}</td><td>${esc(f)}</td><td><button data-act="voz" data-arg="ja" data-t="${esc(jaJunta(e.split(' · ')[0]))}">🔊 ${esc(e)}</button></td></tr>`).join('')}</table>`:'');
}

let alfaL='ja',alfaSub='hira',alfaSel=null,alfaQ=null;
/** Lista [kana, rōmaji] de la tabla actual (básicos + tenten/maru + combinaciones). */
function kanaLista(kata){
  const out=[],cv=s=>kata?aKata(s):s;
  for(const[k,r]of[...KANA_BASE,...KANA_DAK]){const ks=[...k],rs=r.split(' ');ks.forEach((c,i)=>{if(c!=='・')out.push([cv(c),rs[i]])})}
  for(const[k,r]of KANA_YO){const ks=k.split(' '),rs=r.split(' ');ks.forEach((c,i)=>out.push([cv(c),rs[i]]))}
  return out;
}
function kanaGrid(filas,kata,cols){
  return`<div class="letras" style="grid-template-columns:repeat(${cols},1fr);max-width:${cols*92}px">`+filas.map(([k,r])=>{
    const ks=cols===3?k.split(' '):[...k],rs=r.split(' ');
    return ks.map((c,i)=>c==='・'?'<span></span>':`<button class="letra" data-act="voz" data-arg="ja" data-t="${kata?aKata(c):c}"><b>${kata?aKata(c):c}</b><small>${rs[i]}</small></button>`).join('')}).join('')+`</div>`;
}
function vAlfabeto(){
  let h=`<h2>Alfabeto</h2><div class="filtros">${['es','en','fr','de','ja'].map(l=>`<button class="chip ${l} ${alfaL===l?'on':''}" data-act="alfaL" data-arg="${l}">${LANGS[l].n}</button>`).join('')}</div>`;
  if(alfaQ)return h+quizAlfa();
  if(alfaL!=='ja'){
    const a=ALFA[alfaL];
    return h+`<p class="peq">${esc(a.nota)} <span class="mut">Toca una letra para oírla.</span></p>
     <div class="letras">${a.letras.map(([L,n,p])=>`<button class="letra ${alfaL} ${a.esp.includes(L)?'esp':''}" data-act="voz" data-arg="${alfaL}" data-t="${esc(L)}"><b>${L}${L.toLowerCase()!==L?' '+L.toLowerCase():''}</b><small>${esc(n)}${p&&p!==n?' · '+esc(p):''}</small></button>`).join('')}</div>
     <h3>Sonidos clave</h3><table>${a.sonidos.map(([g,c,e])=>`<tr><td><b>${esc(g)}</b></td><td>${esc(c)}</td><td><button data-act="voz" data-arg="${alfaL}" data-t="${esc(e)}">🔊 ${esc(e)}</button></td></tr>`).join('')}</table>`;
  }
  const subs={hira:'Hiragana',kata:'Katakana',kanji:'Kanji'};
  h+=`<div class="sub">${Object.entries(subs).map(([k,v])=>`<button class="${alfaSub===k?'on':''}" data-act="alfaSub" data-arg="${k}">${v}</button>`).join('')}</div>`;
  if(alfaSub==='kanji'){
    const d=alfaSel!==null&&KANJI[alfaSel];
    return h+`<div class="nota"><p>Los kanji dan el <b>significado</b>. Cada uno tiene lecturas <b>on'yomi</b> (de origen chino, se escriben en katakana; suelen usarse en palabras compuestas) y <b>kun'yomi</b> (japonesas, en hiragana; suelen usarse cuando el kanji va solo o con terminación en hiragana). Aquí tienes ${KANJI.length} kanji básicos (nivel N5).</p>
      <div class="fila2" style="justify-content:flex-start"><button class="pri" data-act="alfaQuiz" data-arg="kanji">Practicar significados</button></div></div>`+
     (d?`<div class="orl ja"><div class="top" style="margin:0"><span style="font-size:3rem;line-height:1">${d.k}</span><b>${esc(d.s)}</b><button data-act="alfaSel" data-arg="">Cerrar</button></div>
      <p>On'yomi: <b>${esc(d.on)}</b> · Kun'yomi: <b>${esc(d.kun)}</b></p><p>Ejemplo: <b style="font-size:1.2rem">${esc(d.ej)}</b> (${esc(d.lec)}) = ${esc(d.sig)} ${vozBtn(d.lec,'ja')}</p></div>`:'')+
     `<div class="letras" style="grid-template-columns:repeat(auto-fill,minmax(82px,1fr))">${KANJI.map((k,i)=>`<button class="letra ${alfaSel===i?'esp ja':''}" data-act="alfaSel" data-arg="${i}"><b>${k.k}</b><small>${esc(k.s)}</small></button>`).join('')}</div>`;
  }
  const kata=alfaSub==='kata';
  return h+`<div class="nota"><p>${kata?'<b>Katakana</b>: para palabras extranjeras (コーヒー, パン), nombres de otros países (ペドロ) y onomatopeyas. Las vocales largas se marcan con ー.':'<b>Hiragana</b>: para palabras japonesas, partículas (は, を, に) y terminaciones de verbos y adjetivos. Con ella se puede escribir todo el japonés.'}
    Cada signo es una sílaba. Ojo: ふ = fu, し = shi, ち = chi, つ = tsu; la pequeña っ/ッ duplica la consonante siguiente; como partículas は se lee «wa», へ «e» y を «o».</p>
    <div class="fila2" style="justify-content:flex-start"><button class="pri" data-act="alfaQuiz" data-arg="${alfaSub}">Practicar ${subs[alfaSub].toLowerCase()}</button></div></div>
    <h3>Básicos</h3>${kanaGrid(KANA_BASE,kata,5)}<h3>Con tenten (゛) y maru (゜)</h3>${kanaGrid(KANA_DAK,kata,5)}<h3>Combinaciones (yōon)</h3>${kanaGrid(KANA_YO,kata,3)}`;
}
function iniciarQuizAlfa(tipo){
  const pool=tipo==='kanji'?KANJI.map(k=>({q:k.k,a:k.s,voz:k.lec})):kanaLista(tipo==='kata').map(([k,r])=>({q:k,a:r,voz:k}));
  const qs=baraja(pool).slice(0,10).map(it=>{const otros=[...new Set(baraja(pool).map(x=>x.a).filter(a=>a!==it.a))].slice(0,3);return{...it,ops:baraja([it.a,...otros])}});
  alfaQ={tipo,qs,i:0,ok:0,resp:null};
}
function quizAlfa(){
  const z=alfaQ;
  if(z.i>=z.qs.length)return`<div class="panel"><h2>¡Ronda terminada!</h2><p>Acertaste ${z.ok} de ${z.qs.length}.</p><div class="fila2"><button class="pri" data-act="alfaQuiz" data-arg="${z.tipo}">Otra ronda</button><button data-act="alfaSalir">Volver</button></div></div>`;
  const q=z.qs[z.i];
  return`<div class="panel"><div class="top"><b>${z.tipo==='kanji'?'Kanji':z.tipo==='kata'?'Katakana':'Hiragana'}</b><span class="mut peq">${z.i+1} / ${z.qs.length}</span><button data-act="alfaSalir">Salir</button></div>
    <div class="preg" style="font-size:3.2rem">${q.q}</div><p class="mut" style="text-align:center">${z.tipo==='kanji'?'¿Qué significa?':'¿Cómo se lee?'}</p>
    <div class="ops" style="grid-template-columns:1fr 1fr">${q.ops.map((o,i)=>`<button ${z.resp!==null?'disabled':''} class="${z.resp===null?'':o===q.a?'bien':i===z.resp?'mal':''}" data-act="alfaR" data-arg="${i}">${esc(o)}</button>`).join('')}</div>`+
    (z.resp!==null?`<div class="fila2"><button class="pri" data-act="alfaSig">Siguiente</button></div>`:'')+`</div>`;
}

let hSel=null,hPrin='',hModo='siempre',hVer=new Set(),hLeyendo=false,hNivel='all';

   <div class="grid">${hs.map(h=>`<button class="tema" data-act="hAbrir" data-arg="${h.id}">

  return`<div class="fila2" style="justify-content:space-between;margin:0 0 10px"><button data-act="hCerrar">← Historias</button>

    ${(()=>{const i=HISTORIAS.indexOf(h),sig=HISTORIAS[i+1];return sig?`<button data-act="hAbrir" data-arg="${sig.id}">Siguiente: ${esc(sig.titulo.es)} →</button>`:''})()}</div>`;

/** Lee en voz alta todas las frases, una tras otra. */
async function leerHistoria(h,l){
  hLeyendo=true;pintar();
  for(const f of h.frases){
    if(!hLeyendo)break;
    const txt=f[l];
    if(esNativo()){try{await nativo('TextToSpeech','speak',{text:txt,lang:LANGS[l].v,rate:.9,pitch:1,volume:1,category:'ambient'})}catch(e){break}}
    else if('speechSynthesis' in window){await new Promise(res=>{const u=new SpeechSynthesisUtterance(txt);u.lang=LANGS[l].v;u.rate=.9;u.onend=u.onerror=res;speechSynthesis.speak(u)})}
    else break;
  }
  hLeyendo=false;if(vista==='historias')pintar();
}
Object.assign(A,{
  hNivel(k){hNivel=k;pintar()},
  hAbrir(id){hSel=id;hVer=new Set();hLeyendo=false;try{speechSynthesis.cancel()}catch(e){}if(vista!=='historias')vista='historias';pintar();scrollTo(0,0)},
  hCerrar(){hSel=null;hLeyendo=false;try{speechSynthesis.cancel()}catch(e){}pintar()},
  hVer(i){if(hModo!=='tocar')return;i=+i;hVer.has(i)?hVer.delete(i):hVer.add(i);pintar()},
  hLeer(){const h=HISTORIAS.find(x=>x.id===hSel);if(hLeyendo){hLeyendo=false;try{speechSynthesis.cancel()}catch(e){}if(esNativo())nativo('TextToSpeech','stop',{}).catch(()=>{});pintar()}else leerHistoria(h,hPrin||S.cfg.prioridad)},
  hFin(){S.leidas=S.leidas||{};S.leidas[hSel]=fecha();ganar(20);toast('📖 Historia leída: +20 XP');pintar()}
});

/* =====================================================================
   15. PWA: instalación, funcionamiento sin conexión y accesos directos
   ---------------------------------------------------------------------
   Solo se activa cuando la app se sirve por http(s) (no en Android/Windows
   empaquetados ni al abrir el archivo directamente). Usa manifest.webmanifest,
   sw.js e icons/ que están junto a index.html.
   ===================================================================== */
let promptInstalar=null;
const esPWAweb=/^https?:$/.test(location.protocol)&&!esNativo()&&!/Electron/.test(navigator.userAgent);
const instalada=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const esIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(esPWAweb){
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptInstalar=e;bannerInstalar();if(vista==='hoy'||vista==='datos')pintar()});
  addEventListener('appinstalled',()=>{promptInstalar=null;bannerInstalar();toast('Cuatro Lenguas quedó instalada');if(vista==='hoy'||vista==='datos')pintar()});
}
/** Aviso flotante de instalación (todas las vistas). Se puede cerrar; vuelve a los 3 días. */
const esAndroid=/Android/i.test(navigator.userAgent);
function bannerInstalar(){
  let b=document.getElementById('bInstalar');
  let cerrado=0;try{cerrado=+localStorage.getItem('cl.instalarCerrado')||0}catch(e){}
  const mostrar=esPWAweb&&!instalada()&&Date.now()-cerrado>3*864e5&&(promptInstalar||esIOS||esAndroid);
  if(!mostrar){if(b)b.remove();return}
  if(!b){b=document.createElement('div');b.id='bInstalar';document.body.append(b)}
  const txt=promptInstalar?'Tenla en tu pantalla de inicio: abre sin internet y en pantalla completa.'
    :esIOS?'En Safari toca <b>Compartir</b> ⬆️ y luego <b>Agregar a pantalla de inicio</b>.'
    :'Abre el menú <b>⋮</b> de Chrome y toca <b>Instalar app</b> (o «Agregar a pantalla principal»).';
  b.innerHTML=`<img src="icons/icon-192.png" alt=""><span><b>Instala Cuatro Lenguas</b><br><span>${txt}</span></span>
    ${promptInstalar?'<button class="pri" data-act="pwaInstalar">Instalar</button>':''}<button class="x" data-act="pwaCerrar" aria-label="Cerrar">✕</button>`;
}
if(esPWAweb){addEventListener('load',()=>setTimeout(bannerInstalar,esAndroid?3500:800))}
/** Bloque «Instalar» para Hoy y Datos. */
function instalarHTML(enHoy){
  if(!esPWAweb||instalada())return enHoy?'':`<p class="mut peq">${esPWAweb?'La app ya está instalada en este dispositivo.':'Para instalarla como app, ábrela desde su dirección web (https). Las versiones Android y Windows ya son apps.'}</p>`;
  if(promptInstalar)return`<div class="card" style="padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap${enHoy?';margin-top:14px':''}">
    <span><b>Instala Cuatro Lenguas</b><br><span class="mut peq">Ábrela desde tu pantalla de inicio, en pantalla completa y sin conexión.</span></span>
    <button class="pri" data-act="pwaInstalar">Instalar</button></div>`;
  if(esIOS)return`<div class="card peq" style="padding:14px 16px${enHoy?';margin-top:14px':''}"><b>Instálala en tu iPhone o iPad:</b> toca <b>Compartir</b> (el cuadrado con flecha) y luego <b>Agregar a pantalla de inicio</b>.</div>`;
  return enHoy?'':`<p class="mut peq">Si tu navegador lo permite, verás la opción «Instalar app» en su menú.</p>`;
}
Object.assign(A,{
  async pwaInstalar(){if(!promptInstalar)return;promptInstalar.prompt();try{await promptInstalar.userChoice}catch(e){}promptInstalar=null;bannerInstalar();pintar()},
  pwaCerrar(){try{localStorage.setItem('cl.instalarCerrado',Date.now())}catch(e){}bannerInstalar()}
});
/** Accesos directos del ícono (manifest «shortcuts»): ?accion=sesion | diario | historias */
function accionInicial(){
  const a=new URLSearchParams(location.search).get('accion');if(!a)return;
  if(a==='sesion')A.hoyMix();else if(a==='diario')A.hoyDiario();else if(a==='historias')A.vista('historias');else if(a==='leccion')A.lecEmpezar(siguienteLeccion(cursoL()).id);else if(a==='ruta')A.vista('ruta');else if(a==='gramatica')A.vista('reglas');
  try{history.replaceState(null,'',location.pathname)}catch(e){}
}

/* ---------- Construcción de una lección ---------- */
function crearLeccion(tid,L){
  const t=TODOS.find(x=>x.id===tid),c=coronas(L,tid);
  const pool=t.items.filter(i=>i[L].t&&i.es.t&&!i.es.t.startsWith('✗')&&!i[L].t.includes('…'));
  const frases=pool.filter(i=>i.tags.includes('f')&&tok(i,L).length>=3);
  const fras2=frases.length?frases:temasVis().flatMap(x=>x.nivel===t.nivel?x.items:[]).filter(i=>i.tags.includes('f')&&i[L].t&&tok(i,L).length>=3);
  const pals=pool.filter(i=>!i.tags.includes('f')&&!i[L].t.includes('→'));
  const usados=new Set(),toma=(p)=>{const lib=p.filter(i=>!usados.has(i.id));const it=eligeItem(lib.length?lib:p,L);if(it)usados.add(it.id);return it};
  let plan=['elegir','escuchar','elegir_inv','pares','armar','escuchar','completar','escribir','armar','escribir'];
  if(c>=2)plan=['escuchar','armar','pares','escribir','completar','escribir','armar','escuchar','escribir','armar'];
  const ejs=[];
  for(let tipo of plan){
    if((tipo==='armar'||tipo==='completar')&&!fras2.length)tipo='elegir';
    if(tipo==='pares'&&new Set(pals.map(i=>limpio(i[L].t))).size<5)tipo='elegir_inv';
    if(tipo==='escribir'&&!pool.some(i=>JUEGOS.escribir.ok(i,L)))tipo='escuchar';
    const ej=nuevoEj(tipo,L,tipo==='armar'||tipo==='completar'?fras2:tipo==='escribir'?pool.filter(i=>JUEGOS.escribir.ok(i,L)):tipo==='pares'?pals:(pals.length>=4?pals:pool),toma,pool);
    if(ej)ejs.push(ej);
  }
  const rs=reglasDeTema(tid).filter(g=>g.filas[L]);
  if(rs.length&&c===0)ejs.unshift({tipo:'regla',g:rs[0]});
  return{L,tid,ejs,i:0,vidas:5,ok:0,err:0,combo:0,maxCombo:0,t0:Date.now(),estado:'resp',fb:null,xp:0};
}
function opcionesDe(it,campo,pool,n=3){
  const vistos=new Set([norm(campo(it))]),r=[];
  for(const x of baraja([...it.tm.items,...pool])){const v=campo(x);if(!v||vistos.has(norm(v)))continue;vistos.add(norm(v));r.push(x);if(r.length>=n)break}

}
function nuevoEj(tipo,L,p,toma,pool){
  if(tipo==='pares'){const vs=new Set(),its=baraja(p).filter(i=>{const k=limpio(i[L].t),e=limpio(i.es.t);if(vs.has(k)||vs.has('es:'+e))return false;vs.add(k);vs.add('es:'+e);return true}).slice(0,5);
    return its.length<4?null:{tipo,its,izq:baraja(its),der:baraja(its),hechos:new Set(),sel:null,mal:null}}
  const it=toma(p);if(!it)return null;
  if(tipo==='elegir')return{tipo,it,de:'es',a:L,ops:opcionesDe(it,x=>x[L].t,pool),resp:null};
  if(tipo==='elegir_inv')return{tipo:'elegir',it,de:L,a:'es',ops:opcionesDe(it,x=>x.es.t,pool),resp:null};
  if(tipo==='escuchar')return{tipo,it,ops:opcionesDe(it,x=>x[L].t,pool),resp:null,oido:false};

  const fb=z.fb;

   <div class="lec-pie ${fb?(fb.ok?'ok':'no'):''}"><div class="lec-pie-in">
     ${fb?`<div class="lec-fb"><b>${fb.ok?FRASES_OK[rnd(FRASES_OK.length)]+(z.combo>=3?` 🔥 ${z.combo} seguidas`:''):'Respuesta correcta:'}</b>
       ${!fb.ok||z.aviso?`<span>${esc(fb.ok?z.aviso:fb.correcta)}</span>`:''}${fb.it?`<span class="mut peq">${pron(fb.it,L)}${notaDe(fb.it,L)?' · '+esc(notaDe(fb.it,L)):''}</span>`:''}</div>
       <button class="pri grande" data-act="lecCont" id="lecBtn">Continuar</button>`
      :ej.tipo==='pares'?'<span class="mut peq">Empareja todas las palabras</span>':`<button class="grande" data-act="lecSaltar">Saltar</button><button class="pri grande" data-act="lecComp" id="lecBtn" ${listo(ej)?'':'disabled'}>${ej.tipo==='regla'?'Entendido':'Comprobar'}</button>`}

}

  lecComp(){comprobar()},

  lecCont(){avanzar()},
  lecSaltar(){const ej=lec.ejs[lec.i];if(ej.tipo==='regla'){avanzar();return}registrar(ej.it,lec.L,false,0);resultado(false,textoL(ej.it,ej.tipo==='elegir'?ej.a:lec.L),ej.it)},
  lecParI(i){const ej=lec.ejs[lec.i];ej.sel=+i;pintaLeccion()},
  lecParD(j){const ej=lec.ejs[lec.i];if(ej.sel===null||lec.estado!=='resp'||lec.vidas<=0)return;const a=ej.izq[ej.sel],b=ej.der[+j];
    if(a===b){ej.hechos.add(a.id);registrar(a,lec.L,true,0);hablar(a[lec.L].t,lec.L);ej.sel=null;sonido('ok');
      if(ej.hechos.size===ej.izq.length){lec.ok++;lec.combo++;lec.maxCombo=Math.max(lec.maxCombo,lec.combo);lec.fb={ok:true,correcta:'',it:null};lec.estado='fb'}pintaLeccion()}
    else{registrar(a,lec.L,false,0);lec.vidas--;lec.err++;lec.combo=0;sonido('mal');ej.mal=[ej.sel,+j];ej.sel=null;pintaLeccion();
      setTimeout(()=>{if(lec&&lec.ejs[lec.i]===ej){ej.mal=null;if(lec.vidas<=0){lec.estado='perdido'}pintaLeccion()}},450)}}

document.addEventListener('keydown',e=>{

/* =====================================================================
   11. SINCRONIZACIÓN CON FIREBASE (opcional)
   ---------------------------------------------------------------------
   La app sigue siendo «local primero»: todo se guarda en el dispositivo y,
   si hay sesión, se combina con Firestore (sin perder datos de ningún lado).
   Configuración: pega aquí la de tu proyecto (Firebase › Configuración del
   proyecto › Tus apps › Web) o pégala desde la app en Datos › Sincronización.
   Requiere Authentication (Correo/contraseña) y Cloud Firestore.
   Firestore:  usuarios/{uid}/datos/progreso   { json, upd }
               usuarios/{uid}/diario/{id}      { json, mod }
   El SDK de Firebase va incluido en este archivo (id="fbsdk"): no depende de un CDN.
   ===================================================================== */
const FIREBASE_CONFIG=null; // ej.: {apiKey:'…',authDomain:'tu-proyecto.firebaseapp.com',projectId:'tu-proyecto',appId:'…'}
const CLAVE_FB='cuatroLenguas.firebase';
let FB=null,fbUser=null,fbEstado='',fbMsg='',sincronizando=false,tSync=null,ultimaSync=0;
function fbConfig(){if(FIREBASE_CONFIG)return FIREBASE_CONFIG;try{return JSON.parse(localStorage.getItem(CLAVE_FB))}catch(e){return null}}
/** Acepta el bloque tal como lo copia la consola de Firebase («const firebaseConfig = {…}»). */
function leeConfig(txt){
  const m=txt.match(/\{[\s\S]*\}/);if(!m)throw new Error('No encontré { … } en el texto.');
  const j=m[0].replace(/\/\/[^\n]*/g,'').replace(/'/g,'"').replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/,\s*\}/g,'}');
  const c=JSON.parse(j);if(!c.apiKey||!c.projectId)throw new Error('Faltan apiKey o projectId.');return c;
}
const ERR_FB={'auth/invalid-credential':'Correo o contraseña incorrectos.','auth/wrong-password':'Correo o contraseña incorrectos.','auth/user-not-found':'No existe una cuenta con ese correo.',
  'auth/email-already-in-use':'Ese correo ya tiene cuenta: usa «Entrar».','auth/weak-password':'La contraseña debe tener al menos 6 caracteres.','auth/invalid-email':'El correo no es válido.',
  'auth/network-request-failed':'Sin conexión a internet.','auth/operation-not-allowed':'Activa «Correo electrónico/contraseña» en Firebase › Authentication › Método de acceso.',
  'auth/too-many-requests':'Demasiados intentos; espera un momento.','auth/invalid-api-key':'La apiKey de la configuración no es válida.',
  'permission-denied':'Firestore rechazó el acceso: publica las reglas de seguridad incluidas (firestore.rules).','unavailable':'Firestore no está disponible ahora; se reintentará.'};
const errFB=e=>ERR_FB[e?.code]||e?.message||String(e);
async function fbIniciar(){
  const cfg=fbConfig();if(!cfg||FB)return;
  try{
    const sdk=await import(URL.createObjectURL(new Blob([$('#fbsdk').textContent],{type:'text/javascript'})));
    const app=sdk.initializeApp(cfg);FB={sdk,auth:sdk.getAuth(app),db:sdk.getFirestore(app)};
    sdk.onAuthStateChanged(FB.auth,u=>{fbUser=u;fbEstado='';if(u)sincronizar();pintaStats();if(vista==='datos')pintar()});
    if(vista==='datos')pintar();
  }catch(e){FB=null;fbMsg='No se pudo iniciar Firebase: '+errFB(e);if(vista==='datos')pintar()}
}
function programarSync(){if(!fbUser)return;clearTimeout(tSync);tSync=setTimeout(sincronizar,4000)}
/** Combina el estado local (L) con el de la nube (R) sin perder nada de ninguno. */
function fusionar(L,R){
  const o={...L},n=c=>(c.ok||0)+(c.bad||0);
  o.hist={...(R.hist||{})};for(const[k,v]of Object.entries(L.hist||{}))o.hist[k]=Math.max(v,o.hist[k]||0);
  o.leidas={...(R.leidas||{}),...(L.leidas||{})};
  o.ruta={};for(const src of [R.ruta||{},L.ruta||{}])for(const[l,m]of Object.entries(src)){o.ruta[l]=o.ruta[l]||{};for(const[k,v]of Object.entries(m))o.ruta[l][k]=Math.max(v,o.ruta[l][k]||0)}
  o.lecciones=Math.max(L.lecciones||0,R.lecciones||0);
  o.xp=Math.max(L.xp||0,R.xp||0);o.metas=Math.max(L.metas||0,R.metas||0);
  const rl=L.racha||{n:0,ultimo:''},rr=R.racha||{n:0,ultimo:''};
  o.racha=rr.ultimo>rl.ultimo||(rr.ultimo===rl.ultimo&&rr.n>rl.n)?rr:rl;
  const hl=L.hoy||{dia:'',xp:0},hr=R.hoy||{dia:'',xp:0};
  o.hoy=hr.dia>hl.dia?hr:hr.dia===hl.dia?{dia:hl.dia,xp:Math.max(hl.xp,hr.xp)}:hl;
  o.cards={...(R.cards||{})};
  for(const[k,c]of Object.entries(L.cards||{})){const r=o.cards[k];if(!r||n(c)>n(r)||(n(c)===n(r)&&c.due>r.due))o.cards[k]=c}
  o.medallas={...(R.medallas||{})};for(const[k,v]of Object.entries(L.medallas||{}))if(!o.medallas[k]||v<o.medallas[k])o.medallas[k]=v;
  if((R.upd||0)>(L.upd||0)&&R.cfg)o.cfg={...L.cfg,...R.cfg};
  o.borrados=[...new Set([...(L.borrados||[]),...(R.borrados||[])])].slice(-2000);
  const bor=new Set(o.borrados);
  const cu={};for(const c of [...(R.custom||[]),...(L.custom||[])])cu[c.titulo.toLowerCase()]=c;o.custom=Object.values(cu);
  const ed={};for(const e of [...(R.errDiario||[]),...(L.errDiario||[])])if(!bor.has('e:'+e.lang+'|'+e.orig))ed[e.lang+'|'+e.orig]=e;o.errDiario=Object.values(ed);
  const di={};for(const e of [...(R.diario||[]),...(L.diario||[])]){if(bor.has(e.id))continue;const p=di[e.id];if(!p||(e.mod||0)>=(p.mod||0))di[e.id]=e}
  o.diario=Object.values(di);o.upd=Math.max(L.upd||0,R.upd||0);
  return o;
}
async function sincronizar(){
  if(!FB||!fbUser||sincronizando||!navigator.onLine)return;
  sincronizando=true;fbEstado='sync';pintaStats();clearTimeout(tSync);
  const{sdk,db}=FB,base=['usuarios',fbUser.uid],t0=Date.now();
  try{
    S.sync=S.sync||{};
    for(const e of S.diario)if(!e.mod)e.mod=Date.parse(e.fecha)||1;
    const ref=sdk.doc(db,...base,'datos','progreso');
    const snap=await sdk.getDoc(ref);
    let R=snap.exists()?JSON.parse(snap.data().json):{};
    const qs=await sdk.getDocs(sdk.query(sdk.collection(db,...base,'diario'),sdk.where('mod','>',(S.sync.pull||0)-600000)));
    const remDiario=qs.docs.map(d=>JSON.parse(d.data().json));
    if(S.sync.forzar)R={borrados:R.borrados};       // tras «Borrar progreso» o importar: manda lo local
    R.diario=remDiario;
    const antes=JSON.stringify([S.xp,S.cards,S.diario,S.errDiario,S.medallas,S.custom,S.cfg]);
    const M=fusionar(S,R);M.borrador=S.borrador;M.sync=S.sync;S=M;
    const{diario,borrador,sync,...prog}=S;
    await sdk.setDoc(ref,{json:JSON.stringify(prog),upd:S.upd||0});
    const sube=S.diario.filter(e=>(e.mod||0)>(S.sync.push||0)),borra=S.sync.del||[];
    for(let i=0;i<Math.max(sube.length,borra.length);i+=400){
      const b=sdk.writeBatch(db);
      for(const e of sube.slice(i,i+400))b.set(sdk.doc(db,...base,'diario',e.id),{json:JSON.stringify(e),mod:e.mod||0});
      for(const id of borra.slice(i,i+400))b.delete(sdk.doc(db,...base,'diario',id));
      await b.commit();
    }
    S.sync={pull:t0,push:t0,del:[]};guardarLocal();
    ultimaSync=Date.now();fbEstado='ok';fbMsg='';
    if(antes!==JSON.stringify([S.xp,S.cards,S.diario,S.errDiario,S.medallas,S.custom,S.cfg])){construir();if(!juego)pintar()}
  }catch(e){fbEstado='error';fbMsg='Sincronización: '+errFB(e)}
  finally{sincronizando=false;pintaStats();if(vista==='datos'&&!juego)pintar()}
}
function fbHTML(){
  const cfg=fbConfig();
  let h=`<h3>Sincronización entre dispositivos (Firebase)</h3><p class="mut peq">Opcional. Guarda progreso, diario y contenido importado en tu propio proyecto de Firebase para usar los mismos datos en el celular, en Windows y en el navegador. Sin conexión todo sigue funcionando y se sincroniza al volver.</p>`;
  if(fbMsg)h+=`<div class="aviso">${esc(fbMsg)}</div>`;
  if(!cfg)return h+`<p class="peq">Pega la configuración web de tu proyecto (Firebase › Configuración del proyecto › Tus apps › SDK › Configuración):</p>
    <textarea id="fbCfg" style="min-height:120px;font-size:.8rem" spellcheck="false" placeholder="const firebaseConfig = { apiKey: &quot;…&quot;, authDomain: &quot;…&quot;, projectId: &quot;…&quot;, appId: &quot;…&quot; };"></textarea>
    <div class="fila2" style="justify-content:flex-start"><button class="pri" data-act="fbCfg">Guardar configuración</button></div>`;
  if(!FB)return h+`<p class="mut">Conectando con Firebase…</p>`;
  if(!fbUser)return h+`<div class="cols2"><input type="text" id="fbEmail" placeholder="Correo" autocomplete="email" autocapitalize="off"><input type="password" id="fbPass" placeholder="Contraseña (mínimo 6)" autocomplete="current-password" data-enter="fbEntrar"></div>
    <div class="fila2" style="justify-content:flex-start"><button class="pri" data-act="fbEntrar">Entrar</button><button data-act="fbCrear">Crear cuenta</button><button data-act="fbOlvide">Olvidé mi contraseña</button>${FIREBASE_CONFIG?'':'<button data-act="fbQuitar">Cambiar configuración</button>'}</div>
    <p class="mut peq">Al entrar, lo que tengas en este dispositivo se combina con lo de la nube: no se pierde nada.</p>`;
  return h+`<p>Conectado como <b>${esc(fbUser.email)}</b> · ${fbEstado==='sync'?'sincronizando…':ultimaSync?'última sincronización: '+new Date(ultimaSync).toLocaleTimeString():''}</p>
    <div class="fila2" style="justify-content:flex-start"><button class="pri" data-act="fbSync">Sincronizar ahora</button><button data-act="fbSalir">Cerrar sesión</button></div>`;
}
const credFB=()=>[$('#fbEmail').value.trim(),$('#fbPass').value];
Object.assign(A,{
  fbCfg(){try{localStorage.setItem(CLAVE_FB,JSON.stringify(leeConfig($('#fbCfg').value)));fbMsg='';fbIniciar()}catch(e){fbMsg='Configuración no válida: '+e.message}pintar()},
  fbQuitar(){try{localStorage.removeItem(CLAVE_FB)}catch(e){}FB=null;fbUser=null;fbMsg='';pintar()},
  async fbEntrar(){const[c,p]=credFB();try{await FB.sdk.signInWithEmailAndPassword(FB.auth,c,p);fbMsg=''}catch(e){fbMsg=errFB(e)}pintar()},
  async fbCrear(){const[c,p]=credFB();try{await FB.sdk.createUserWithEmailAndPassword(FB.auth,c,p);fbMsg='';toast('Cuenta creada')}catch(e){fbMsg=errFB(e)}pintar()},
  async fbOlvide(){const[c]=credFB();if(!c){fbMsg='Escribe tu correo primero.';pintar();return}try{await FB.sdk.sendPasswordResetEmail(FB.auth,c);fbMsg='Te enviamos un correo para cambiar la contraseña.'}catch(e){fbMsg=errFB(e)}pintar()},
  async fbSalir(){await FB.sdk.signOut(FB.auth);ultimaSync=0;pintar()},
  fbSync(){sincronizar()}
});
document.addEventListener('visibilitychange',()=>sincronizar());
addEventListener('online',()=>sincronizar());
setInterval(()=>{if(document.visibilityState==='visible')sincronizar()},120000);

construir();
if(!temaAct())S.cfg.tema='all';
$('#logoLado').innerHTML=$('#logoBarra').innerHTML=logoHTML();

accionInicial();
